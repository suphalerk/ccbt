# =============================================================================
# docker-compose-multi.yml — Grouped multi-bot containers
# Uses main_multi.py: one process per group, shared ccxt exchange object
#
# Memory comparison:
#   Old (individual): 174 containers × 512MB = 89088MB
#   New (grouped):    16 containers, ~6610MB total
#
# Usage:
#   docker compose -f docker-compose-multi.yml up -d
# =============================================================================

services:

  # Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # alligator group (4 bots)
  bot-group-alligator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-alligator
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - BOT_DATA_DIR=/app/data
    command: python main_multi.py --configs /app/config_lightusdt_alligator.json /app/config_linkusdt_alligator4h.json /app/config_qntusdt_alligator4h.json /app/config_suiusdt_alligator4h.json
    volumes:
