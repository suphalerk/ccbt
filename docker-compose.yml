# =============================================================================
# Docker Compose for Crypto Trading Bot — 136-bot portfolio
# Services: 136 trading bots + dashboard (Streamlit UI)
# Shared volume for SQLite database persistence
#
# Config modes:
#   Standard:  docker compose up -d
#   YOLO:      YOLO_MODE=1 docker compose up -d
# =============================================================================

services:

  # =========================================================================
  # EMA Crossover 15m
  # =========================================================================

  # ARC EMA 15m trades=8 pnl=$25.90
  bot-arc-ema:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-arc-ema
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - CONFIG_FILE=config_arcusdt_ema.json
      - BOT_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./config_arcusdt_ema.json:/app/config_arcusdt_ema.json:ro
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.3"
        reservations:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # BTC EMA 15m trades=10 pnl=$471.86
  bot-btc:
