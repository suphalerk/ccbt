# =============================================================================
# Docker Compose for Crypto Trading Bot — 47-bot portfolio
# Services: 47 trading bots + dashboard (Streamlit UI)
# Shared volume for SQLite database persistence
#
# Config modes:
#   Standard:  docker compose up -d
#   YOLO:      CONFIG_FILE=config_yolo.json YOLO_MODE=1 docker compose up -d
#
# NOTE: Bots marked "TODO: config missing" are running on a prior-version config
# until the target config file is generated by scripts/generate_configs.py.
# =============================================================================

services:

  # ===========================================================================
  # Strategy 1: EMA Crossover 15m (2 bots)
  # YOLO_MODE=1 required — these configs have risk > 2%
  # ===========================================================================

  # BTC EMA 15m  (PF 1.41, WR 42%, 24 tr/yr, Sharpe 0.91)
  bot-btc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-btc
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - CONFIG_FILE=config.json
      - BOT_DATA_DIR=/app/data
      - YOLO_MODE=1
      - BOT_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # WIF EMA 15m  (PF 1.71, WR 42%, 36 tr/yr, Sharpe 1.46)
