    command: >
      streamlit run dashboard/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
      --server.enableCORS=false
      --server.enableXsrfProtection=true
    env_file:
      - .env
    environment:
      - CONFIG_FILE=${CONFIG_FILE:-config.json}
    ports:
      # Expose Streamlit port; nginx will reverse-proxy to this
      - "127.0.0.1:8501:8501"
    volumes:
      # Share the same data volume so dashboard reads the bot's database
      - bot-data:/app/data
      - ./config.json:/app/config.json:ro
      - ./config_aggressive.json:/app/config_aggressive.json:ro
      - ./config_yolo.json:/app/config_yolo.json:ro
      - ./config_sniper.json:/app/config_sniper.json:ro
      - ./config_doge.json:/app/config_doge.json:ro
      - ./config_arb.json:/app/config_arb.json:ro
      - ./config_wif.json:/app/config_wif.json:ro
      - ./config_1000shibusdt_ichi.json:/app/config_1000shibusdt_ichi.json:ro
      - ./config_animeusdt_ichi.json:/app/config_animeusdt_ichi.json:ro
      - ./config_arcusdt_ema.json:/app/config_arcusdt_ema.json:ro
      - ./config_arcusdt_ichi.json:/app/config_arcusdt_ichi.json:ro
      - ./config_athusdt_ichi.json:/app/config_athusdt_ichi.json:ro
      - ./config_berausdt_ichi.json:/app/config_berausdt_ichi.json:ro
      - ./config_gunusdt_ichi.json:/app/config_gunusdt_ichi.json:ro
      - ./config_injusdt_ichi.json:/app/config_injusdt_ichi.json:ro
      - ./config_trumpusdt_ichi.json:/app/config_trumpusdt_ichi.json:ro
      - ./config_trxusdt_ichi.json:/app/config_trxusdt_ichi.json:ro
      - ./config_xlmusdt_ichi.json:/app/config_xlmusdt_ichi.json:ro
      - ./config_zetausdt_ichi.json:/app/config_zetausdt_ichi.json:ro
      - ./config_taousdt_ichi4h.json:/app/config_taousdt_ichi4h.json:ro
      - ./config_renderusdt_ichi4h.json:/app/config_renderusdt_ichi4h.json:ro
      - ./config_hbarusdt_ichi4h.json:/app/config_hbarusdt_ichi4h.json:ro
      - ./config_polusdt_ichi4htrail.json:/app/config_polusdt_ichi4htrail.json:ro
      - ./config_polyxusdt_ichi4htrail.json:/app/config_polyxusdt_ichi4htrail.json:ro
      - ./config_fetusdt_ichi4htrail.json:/app/config_fetusdt_ichi4htrail.json:ro
      - ./config_algousdt_ichi4htrail.json:/app/config_algousdt_ichi4htrail.json:ro
      - ./config_mstrusdt_supertrend.json:/app/config_mstrusdt_supertrend.json:ro
      - ./config_xagusdt_supertrend.json:/app/config_xagusdt_supertrend.json:ro
      - ./config_saharausdt_supertrend.json:/app/config_saharausdt_supertrend.json:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    depends_on:
      - bot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Named volume for data persistence
volumes:
  bot-data:
    driver: local
