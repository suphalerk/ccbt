# =============================================================================
# Docker Compose for Crypto Trading Bot
# Services: bot (trading engine) + dashboard (Streamlit UI)
# Shared volume for SQLite database persistence
#
# Config modes:
#   Standard:  docker compose up -d
#   YOLO:      CONFIG_FILE=config_yolo.json YOLO_MODE=1 docker compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Trading Bot Service
  # Runs the main trading loop (main.py)
  # ---------------------------------------------------------------------------
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - CONFIG_FILE=${CONFIG_FILE:-config.json}
      - YOLO_MODE=${YOLO_MODE:-}
    volumes:
      # Persist SQLite database and logs across container restarts
      - bot-data:/app/data
      # Mount config as read-only (allows hot-swap without rebuild)
      - ./config.json:/app/config.json:ro
      - ./config_aggressive.json:/app/config_aggressive.json:ro
      - ./config_yolo.json:/app/config_yolo.json:ro
      - ./config_sniper.json:/app/config_sniper.json:ro
      - ./config_doge.json:/app/config_doge.json:ro
      - ./config_arb.json:/app/config_arb.json:ro
      - ./config_wif.json:/app/config_wif.json:ro
    # Resource limits to prevent runaway memory/CPU usage
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    # Health check is defined in Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # DOGE Bot Service
  # ---------------------------------------------------------------------------
  bot-doge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-doge
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - CONFIG_FILE=config_doge.json
      - YOLO_MODE=1
    volumes:
      - bot-data:/app/data
      - ./config_doge.json:/app/config_doge.json:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # ARB Bot Service
  # ---------------------------------------------------------------------------
  bot-arb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-arb
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - CONFIG_FILE=config_arb.json
      - YOLO_MODE=1
    volumes:
      - bot-data:/app/data
      - ./config_arb.json:/app/config_arb.json:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # WIF Bot Service
  # ---------------------------------------------------------------------------
  bot-wif:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-wif
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - CONFIG_FILE=config_wif.json
      - YOLO_MODE=1
    volumes:
      - bot-data:/app/data
      - ./config_wif.json:/app/config_wif.json:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # AVAX Ichimoku Bot Service
  # ---------------------------------------------------------------------------
  bot-avax:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-avax
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - CONFIG_FILE=config_avax_ichi.json
    volumes:
      - bot-data:/app/data
      - ./config_avax_ichi.json:/app/config_avax_ichi.json:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # NEAR Ichimoku Bot Service
  # ---------------------------------------------------------------------------
  bot-near:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-near
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - CONFIG_FILE=config_near_ichi.json
    volumes:
      - bot-data:/app/data
      - ./config_near_ichi.json:/app/config_near_ichi.json:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # SOL Ichimoku Bot Service
  # ---------------------------------------------------------------------------
  bot-sol:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-sol
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - CONFIG_FILE=config_sol_ichi.json
    volumes:
      - bot-data:/app/data
      - ./config_sol_ichi.json:/app/config_sol_ichi.json:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Dashboard Service
  # Runs Streamlit web UI for monitoring trades and performance
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot-dashboard
    restart: on-failure:5
    # Override the default CMD to run Streamlit instead of the bot
    command: >
      streamlit run dashboard/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
      --server.enableCORS=false
      --server.enableXsrfProtection=true
    env_file:
      - .env
    environment:
      - CONFIG_FILE=${CONFIG_FILE:-config.json}
    ports:
      # Expose Streamlit port; nginx will reverse-proxy to this
      - "127.0.0.1:8501:8501"
    volumes:
      # Share the same data volume so dashboard reads the bot's database
      - bot-data:/app/data
      - ./config.json:/app/config.json:ro
      - ./config_aggressive.json:/app/config_aggressive.json:ro
      - ./config_yolo.json:/app/config_yolo.json:ro
      - ./config_sniper.json:/app/config_sniper.json:ro
      - ./config_doge.json:/app/config_doge.json:ro
      - ./config_arb.json:/app/config_arb.json:ro
      - ./config_wif.json:/app/config_wif.json:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    depends_on:
      - bot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Named volume for data persistence
volumes:
  bot-data:
    driver: local
