      resources:
        limits:
          memory: 192M
          cpus: "0.3"
        reservations:
          memory: 64M
          cpus: "0.1"
    depends_on:
      - bot-btc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Data directory bind-mounted from host (./data) so local dashboard
# and monitoring tools can access trades.db and heartbeat files directly.
