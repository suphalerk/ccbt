      - ./config_injusdt_ichi.json:/app/config_injusdt_ichi.json:ro
      - ./config_trumpusdt_ichi.json:/app/config_trumpusdt_ichi.json:ro
      - ./config_trxusdt_ichi.json:/app/config_trxusdt_ichi.json:ro
      - ./config_xlmusdt_ichi.json:/app/config_xlmusdt_ichi.json:ro
      - ./config_zetausdt_ichi.json:/app/config_zetausdt_ichi.json:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    depends_on:
      - bot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Named volume for data persistence
volumes:
  bot-data:
    driver: local
