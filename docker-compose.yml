# =============================================================================
# Docker Compose for Crypto Trading Bot
# Services: bot (trading engine) + dashboard (Streamlit UI)
# Shared volume for SQLite database persistence
#
# Config modes:
#   Standard:  docker compose up -d
#   YOLO:      CONFIG_FILE=config_yolo.json YOLO_MODE=1 docker compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Trading Bot Service
  # Runs the main trading loop (main.py)
  # ---------------------------------------------------------------------------
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - CONFIG_FILE=${CONFIG_FILE:-config.json}
      - YOLO_MODE=${YOLO_MODE:-}
    volumes:
      # Persist SQLite database and logs across container restarts
      - bot-data:/app/data
      # Mount config as read-only (allows hot-swap without rebuild)
      - ./config.json:/app/config.json:ro
      - ./config_aggressive.json:/app/config_aggressive.json:ro
      - ./config_yolo.json:/app/config_yolo.json:ro
      - ./config_sniper.json:/app/config_sniper.json:ro
      - ./config_doge.json:/app/config_doge.json:ro
      - ./config_arb.json:/app/config_arb.json:ro
      - ./config_wif.json:/app/config_wif.json:ro
    # Resource limits to prevent runaway memory/CPU usage
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    # Health check is defined in Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

