# =============================================================================
# nginx-ws-v2.conf — Nginx WebSocket + v2 dashboard snippet
#
# APPEND to (or include from) the HTTPS server block in deploy/nginx.conf.
# This adds WebSocket upgrade support for the new /ws endpoint and a
# dedicated rate-limit zone so WS connections cannot exhaust the REST budget.
#
# The v2 backend (uvicorn api.main:app) runs on port 8601 (127.0.0.1 only).
# The legacy Streamlit stays on 8501 during the N13 soak.
#
# Usage on VPS:
#   1. Paste the upstream block BEFORE the server{} block in nginx.conf.
#   2. Paste the two location blocks INSIDE the HTTPS server{} block.
#   3. Test: sudo nginx -t
#   4. Reload: sudo systemctl reload nginx
# =============================================================================

# ---------------------------------------------------------------------------
# Rate-limit zone dedicated to WS connections (separate from the REST zone
# "dashboard:10m rate=10r/s" so a WS flood cannot starve REST requests).
# WS connections are long-lived — 2r/s is plenty for initial handshakes.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=ws_v2:10m rate=2r/s;

# ---------------------------------------------------------------------------
# Upstream for the new FastAPI / Vite SPA backend (port 8601)
# ---------------------------------------------------------------------------
upstream ccbt_v2_backend {
    server 127.0.0.1:8601;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# /ws — WebSocket endpoint (N2 snapshot channel + N7 log tail at /ws/logs)
#
# IMPORTANT:
#   proxy_read_timeout 0  — never time out; WebSocket connections are
#     long-lived and the nginx default (60s) would silently disconnect clients.
#   proxy_buffering off   — send frames as they arrive, no buffering.
# ---------------------------------------------------------------------------
location /ws {
    # Outer gate: nginx basic auth (same .htpasswd as /v2).
    # WebSocket upgrade requests arrive as a plain HTTP GET to /ws *before* the
    # 101 handshake; nginx evaluates auth_basic at that point.  Without it any
    # unauthenticated client can open unlimited WS connections bypassing the
    # password gate.
    auth_basic "CCBT Dashboard v2";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Inner gate: FastAPI checks ?token=<CCBT_DASH_TOKEN> query param.
    # nginx passes the full URI including query string to the upstream by default
    # (proxy_pass with a named upstream and no path appends $request_uri verbatim).
    # The browser obtains the token from window.__CCBT_TOKEN__ which is injected
    # into index.html by the FastAPI spa_catch_all handler when CCBT_DASH_TOKEN
    # is set.  buildWsUrl() in useLiveSnapshot.ts appends ?token= from that value.
    #
    # Do NOT strip the query string here — the token must reach FastAPI.

    proxy_pass http://ccbt_v2_backend;
    proxy_http_version 1.1;

    # WebSocket upgrade
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Pass client info
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Never time out WebSocket connections
    proxy_read_timeout 0;
    proxy_send_timeout 0;

    # No buffering — forward frames immediately
    proxy_buffering off;
    proxy_cache    off;

    # WS-specific rate limit (more lenient burst for reconnects)
    limit_req zone=ws_v2 burst=5 nodelay;

    # SECURITY: ?token= appears in $request_uri — never write it to access logs.
    access_log off;
}

# ---------------------------------------------------------------------------
# /v2 — Vite SPA + REST API proxied to the FastAPI backend on port 8601.
#
# Asset-path strategy: the Vite bundle is built with Vite's default base="/"
# so it emits root-absolute asset URLs:
#
#   <script src="/assets/index-LbfGwAlX.js">
#   <link href="/assets/index-BtJqyiHr.css">
#   <link rel="icon" href="/favicon.svg">
#
# When a user visits /v2/, the browser receives index.html from FastAPI (via
# the /v2 location + rewrite below).  Then the browser fetches:
#
#   GET /assets/index-LbfGwAlX.js   ← root-relative — NOT /v2/assets/...
#   GET /favicon.svg                 ← root-relative
#
# These requests arrive at nginx root (/), NOT at /v2, so the /v2 location
# cannot handle them.  Without explicit root-level location blocks they get
# a 404 (or fall through to the legacy Streamlit proxy) and the SPA never
# loads — the browser shows a blank page with no JS errors because the script
# tag simply 404s silently.
#
# Fix: add root-level /assets, /favicon.svg, and /icons.svg location blocks
# that proxy to the same v2 backend.  These blocks are deliberately kept
# INSIDE the same auth_basic gate as /v2 — an unauthenticated client will
# still be challenged before receiving any asset.
#
# The /v2 rewrite approach:
#   Browser: GET /v2/               → nginx rewrites to GET /  → FastAPI serves index.html  ✓
#   Browser: GET /assets/index-.js  → /assets location → FastAPI serves the JS file          ✓
#
# Do NOT use Vite base="/v2/" — that emits /v2/assets/... paths which break
# the /assets fallback below (and require an nginx rewrite on every asset URL).
# The current build (base="/") + root /assets location is the correct pairing.
#
# Replace the existing Streamlit proxy_pass block at N13 cutover.
# ---------------------------------------------------------------------------

# Shared proxy settings used by /v2, /assets, /favicon.svg, /icons.svg
# (defined as a map here for readability; duplicated inline in each block
# because nginx does not support include-inside-location portably).

location /v2 {
    # Basic auth (same .htpasswd as legacy dashboard)
    auth_basic "CCBT Dashboard v2";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Strip the /v2 prefix before forwarding to FastAPI.
    # The trailing slash on the rewrite target ensures /v2 (no slash) also works.
    rewrite ^/v2(/.*)$ $1 break;
    rewrite ^/v2$       /  break;

    # Forward the dashboard token so FastAPI can log/track it
    proxy_set_header X-Dash-Token $http_x_dash_token;

    proxy_pass http://ccbt_v2_backend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SPA: static assets are long-lived; API responses are not cached
    proxy_buffering off;
    proxy_cache    off;

    # Re-use the existing REST rate limit zone
    limit_req zone=dashboard burst=20 nodelay;
}

# ---------------------------------------------------------------------------
# Root-level static asset locations — required because the Vite bundle emits
# root-absolute URLs (/assets/..., /favicon.svg) that the browser fetches
# directly at root, BYPASSING the /v2 prefix.  Without these blocks the SPA
# loads a blank page because the JS/CSS/icon requests all 404.
#
# These blocks mirror /v2's auth_basic gate so assets are still protected.
# The FastAPI spa_catch_all handler serves them from web/dist/ by full_path.
# ---------------------------------------------------------------------------

location /assets/ {
    auth_basic "CCBT Dashboard v2";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://ccbt_v2_backend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Dash-Token      $http_x_dash_token;

    # Static assets are immutable (content-hashed filenames) — long-lived cache
    proxy_buffering off;
    proxy_cache    off;
    add_header Cache-Control "public, max-age=31536000, immutable";

    limit_req zone=dashboard burst=40 nodelay;
}

location = /favicon.svg {
    auth_basic "CCBT Dashboard v2";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://ccbt_v2_backend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Dash-Token      $http_x_dash_token;

    proxy_buffering off;
    proxy_cache    off;
    add_header Cache-Control "public, max-age=86400";

    limit_req zone=dashboard burst=10 nodelay;
}

location = /icons.svg {
    auth_basic "CCBT Dashboard v2";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://ccbt_v2_backend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Dash-Token      $http_x_dash_token;

    proxy_buffering off;
    proxy_cache    off;
    add_header Cache-Control "public, max-age=86400";

    limit_req zone=dashboard burst=10 nodelay;
}

# ---------------------------------------------------------------------------
# /api/ — REST API calls from the Vite SPA.
#
# The Vite bundle is served from root (base="/") and makes REST calls to
# root-absolute paths like /api/bots, /api/health, /api/portfolio.  Without
# this block those requests hit nginx root and either 404 or fall through to
# the legacy Streamlit proxy (which returns Streamlit HTML instead of JSON).
#
# Mirror the /assets/ block but WITHOUT an immutable Cache-Control — API
# responses must never be cached (they carry live trading state).
# ---------------------------------------------------------------------------
location /api/ {
    auth_basic "CCBT Dashboard v2";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://ccbt_v2_backend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Dash-Token      $http_x_dash_token;

    # API responses must never be cached — they carry live state
    proxy_buffering off;
    proxy_cache    off;
    # Prevent intermediaries (CDN, ISP transparent proxies) from caching live state
    add_header Cache-Control "no-store" always;

    limit_req zone=dashboard burst=20 nodelay;
}
