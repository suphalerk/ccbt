# =============================================================================
# Nginx Configuration for Crypto Trading Bot Dashboard
#
# Features:
#   - Reverse proxy to Streamlit (port 8501)
#   - Basic authentication
#   - WebSocket upgrade support (required by Streamlit)
#   - SSL/TLS with modern configuration
#   - Security headers (HSTS, XSS protection, etc.)
#   - Rate limiting (10 req/s per IP)
#   - fail2ban compatible logging
#
# Usage:
#   Replace DOMAIN_PLACEHOLDER with your actual domain before deploying.
#   The setup.sh script does this automatically.
#
# Manual install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tradingbot
#   sudo sed -i 's/DOMAIN_PLACEHOLDER/your.domain.com/g' /etc/nginx/sites-available/tradingbot
#   sudo ln -sf /etc/nginx/sites-available/tradingbot /etc/nginx/sites-enabled/tradingbot
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Rate limiting: 10 requests per second per client IP
# Burst of 20 allows short traffic spikes without dropping requests
limit_req_zone $binary_remote_addr zone=dashboard:10m rate=10r/s;

# Connection limiting: max 20 simultaneous connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream definition for Streamlit backend
upstream streamlit_backend {
    server 127.0.0.1:8501;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP server: redirect all traffic to HTTPS
# Also serves Let's Encrypt ACME challenges for certificate renewal
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS server: reverse proxy to Streamlit with auth and security
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN_PLACEHOLDER;

    # -----------------------------------------------------------------------
    # SSL Certificate Configuration
    # Managed by Let's Encrypt / Certbot
    # -----------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;

    # SSL protocol and cipher configuration (Mozilla Modern profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # SSL session configuration
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling for faster TLS handshakes
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # -----------------------------------------------------------------------
    # Security Headers
    # -----------------------------------------------------------------------
    # HSTS: force HTTPS for 2 years
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # XSS protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content Security Policy: allow Streamlit's inline scripts and WebSocket
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:;" always;
    # Permissions policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # -----------------------------------------------------------------------
    # Basic Authentication
    # Protects the dashboard with username/password
    # Create password file: sudo htpasswd -c /etc/nginx/.htpasswd admin
    # -----------------------------------------------------------------------
    auth_basic "Trading Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # -----------------------------------------------------------------------
    # Rate and Connection Limiting
    # -----------------------------------------------------------------------
    limit_req zone=dashboard burst=20 nodelay;
    limit_conn conn_limit 20;

    # -----------------------------------------------------------------------
    # Request size limit (Streamlit doesn't need large uploads)
    # -----------------------------------------------------------------------
    client_max_body_size 10m;

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    access_log /var/log/nginx/tradingbot_access.log;
    error_log /var/log/nginx/tradingbot_error.log;

    # -----------------------------------------------------------------------
    # Main application: proxy to Streamlit
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://streamlit_backend;
        proxy_http_version 1.1;

        # Pass client info to backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket upgrade headers (required by Streamlit)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeouts for WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffering configuration
        proxy_buffering off;
        proxy_cache off;
    }

    # -----------------------------------------------------------------------
    # Streamlit static assets: served without authentication
    # These are public CSS/JS files that Streamlit needs to load
    # -----------------------------------------------------------------------
    location /static {
        auth_basic off;
        proxy_pass http://streamlit_backend/static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache static assets for 1 hour
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # -----------------------------------------------------------------------
    # Streamlit internal endpoints: no auth needed
    # -----------------------------------------------------------------------
    location /_stcore/health {
        auth_basic off;
        proxy_pass http://streamlit_backend/_stcore/health;
    }

    location /_stcore/stream {
        proxy_pass http://streamlit_backend/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # Deny access to hidden files (e.g., .env, .git)
    # -----------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
