# newsyslog config for CCBT log rotation
# Install: sudo cp ccbt.newsyslog.conf /etc/newsyslog.d/ccbt.conf
#
# Format:
#   logfile_name [owner:group] mode count size when [B|Z|J] [/pidfile] [sig_num]
#
# Fields:
#   count  — number of rotated files to keep
#   size   — rotate when file exceeds this many KB (0 = don't rotate on size)
#   when   — rotate at this time (e.g. $D0 = daily at midnight, $W0 = weekly Sunday)
#   flags  — J = bzip2, Z = gzip, B = binary (no "last rotated" header), N = no signal

/Users/iceai/Library/Logs/ccbt/bot.log             640  7  10240  *    JN
/Users/iceai/Library/Logs/ccbt/bot-error.log       640  7  10240  *    JN
/Users/iceai/Library/Logs/ccbt/dashboard.log       640  7  10240  *    JN
/Users/iceai/Library/Logs/ccbt/dashboard-error.log 640  7  10240  *    JN
